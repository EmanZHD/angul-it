


<div class="result-page">
    <mat-card class="result-card" appearance="outlined">

        <!-- <div class="success-icon">
            <mat-icon>check_circle</mat-icon>
        </div> -->

        <h1 class="title">Congratulations!</h1>
        <p class="subtitle">You have successfully completed the CAPTCHA.</p>

        <mat-divider class="divider"></mat-divider>

        <!-- Performance -->
        <div class="performance">
            <div class="performance-time">
                <mat-icon>timer</mat-icon>
                <span class="time-value">{{ formattedTine }}</span>
                <span class="time-label">Time taken</span>
            </div>

            <div class="performance-badge" [style.color]="performanceColor" [style.borderColor]="performanceColor">
                {{ performanceLabel }}
            </div>
        </div>

        <div class="rating">
            @for (i of [1,2,3,4,5]; track i) {
            <mat-icon [class.filled]="i <= performanceRating">star</mat-icon>
            }
        </div>

        <p class="message">{{ performanceMessage }}</p>

        <mat-divider class="divider"></mat-divider>

        <div class="actions">
            <button mat-flat-button color="primary" (click)="goHome()">
                <mat-icon>home</mat-icon> Home
            </button>
            <button mat-stroked-button (click)="tryAgain()">
                <mat-icon>refresh</mat-icon> Try Again
            </button>
        </div>

        <p class="footer-note">© 2026 CAPTCHA-izahid — All rights reserved.</p>
    </mat-card>
</div>
