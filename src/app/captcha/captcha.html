<main class="main">
    <div class="content">
        <div class="captcha-title">Select all squares with cars</div>
    </div>
    <form (ngSubmit)="submitCaptcha()">
        <div class="image-grid">
            @for (image of images; track $index) {
            <label class="image-card">
                <input type="checkbox" name="image-{{ $index }}" />
                <img src="{{ image.src }}" alt="Image {{ $index + 1 }}" />
            </label>
            }
        </div>
        <button type="submit" class="submit-btn">Verify</button>
    </form>
</main>
